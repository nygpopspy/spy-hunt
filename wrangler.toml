name = "spy-hunt"
main = "spy-v5.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SpyRoom"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "CR"
class_name = "CrRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CrRoom"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spy-hunt-media"

[vars]
LINE_CHANNEL_ID = "2012817400"
SFU_APP_ID = "342af8c31d0019ee0c0d011b11eb76e7"
