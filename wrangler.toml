name = "spy-hunt"
main = "spy-v5.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SpyRoom"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "CR"
class_name = "CrRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CrRoom"]

[vars]
LINE_CHANNEL_ID = "2012817400"
